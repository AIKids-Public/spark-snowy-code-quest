<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark's Snowy Code Quest</title>
<link rel="icon" href="spark.png">
<style>
  :root {
    --night: #0b1f4d; --night2: #14306e; --sky: #1ea7ff; --blue: #1565d8; --ice: #bfe9ff;
    --snow: #f4fbff; --red: #e63946; --green: #2a9d5c; --gold: #ffc53d; --ink: #10213f;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", "Noto Sans SC",
                 "Kohinoor Devanagari", "Nirmala UI", "Noto Sans Devanagari", "Geeza Pro", "Segoe UI Arabic", "Noto Sans Arabic", sans-serif;
    color: var(--ink);
    background: radial-gradient(ellipse at top, var(--night2), var(--night) 70%) fixed;
    overflow-x: hidden;
  }
  #snow { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 18px; }
  button { font: inherit; cursor: pointer; border: none; }
  button:focus-visible, textarea:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- top bar ---------- */
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; color: white; margin-bottom: 14px; }
  .topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .topbar .brand img { width: 46px; height: auto; flex: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.35)); }
  .topbar h1 { font-size: 1.35rem; margin: 0; letter-spacing: .5px; line-height: 1.2; }
  .topbar .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .aikids { display: block; background: #fff; border-radius: 14px; padding: 6px 14px; box-shadow: 0 4px 14px rgba(0,0,0,.3); line-height: 0; }
  .aikids img { height: 30px; width: auto; display: block; }
  @media (max-width: 900px) {
    .topbar { grid-template-columns: 1fr auto; }
    .topbar .aikids { grid-column: 1 / -1; grid-row: 1; justify-self: center; }
  }
  @media (max-width: 560px) {
    .topbar { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .topbar .actions { justify-content: center; }
    .topbar h1 { font-size: 1.15rem; }
  }
  .pill { background: rgba(255,255,255,.14); color: white; padding: 8px 14px; border-radius: 999px; font-weight: 700; }
  .pill:hover { background: rgba(255,255,255,.25); }

  /* ---------- cards ---------- */
  .card { background: var(--snow); border-radius: var(--radius); padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  .btn { background: var(--blue); color: white; padding: 12px 22px; border-radius: 14px; font-weight: 800; font-size: 1.05rem;
         box-shadow: 0 4px 0 #0c4497; transition: transform .08s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #0c4497; }
  .btn.red { background: var(--red); box-shadow: 0 4px 0 #a51d28; }
  .btn.green { background: var(--green); box-shadow: 0 4px 0 #1a6b3d; }
  .btn.ghost { background: #e3eefb; color: var(--blue); box-shadow: 0 4px 0 #b9cde8; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- title ---------- */
  .title { text-align: center; color: white; padding: 10px 0 20px; }
  .title img { width: 150px; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(0,0,0,.4)); }
  .title h2 { font-size: clamp(2rem, 5vw, 3.2rem); margin: 10px 0 4px; text-shadow: 0 4px 0 var(--blue); }
  .title p { font-size: 1.15rem; opacity: .9; max-width: 640px; margin: 8px auto; }
  @keyframes bob { 50% { transform: translateY(-12px) rotate(-3deg); } }
  .tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 18px; margin-top: 18px; }
  .tier { text-align: left; background: var(--snow); border-radius: var(--radius); padding: 20px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
          transition: transform .15s; border: 4px solid transparent; }
  .tier:hover { transform: translateY(-6px); border-color: var(--gold); }
  .tier .big { font-size: 2.6rem; }
  .tier h3 { margin: 6px 0 2px; font-size: 1.35rem; }
  .tier .ages { display: inline-block; background: var(--sky); color: white; font-weight: 800; border-radius: 999px; padding: 2px 12px; }
  .tier p { margin: 10px 0 4px; }
  .tier .stars { color: var(--gold); font-size: 1.1rem; letter-spacing: 2px; }

  /* ---------- mission list ---------- */
  .missions { display: grid; gap: 14px; }
  .mission { display: flex; align-items: center; gap: 16px; text-align: left; padding: 18px; background: var(--snow); border-radius: var(--radius); }
  .mission .num { width: 54px; height: 54px; border-radius: 50%; background: var(--blue); color: white; display: grid; place-items: center; font-size: 1.5rem; font-weight: 900; flex: none; }
  .mission.locked { opacity: .55; cursor: not-allowed; }
  .mission.locked .num { background: #8494ad; }
  .mission h3 { margin: 0; }
  .mission .stars { margin-left: auto; font-size: 1.5rem; color: var(--gold); white-space: nowrap; }

  /* ---------- play layout ---------- */
  .play { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px) { .play { grid-template-columns: 1fr; } }
  .boardwrap { position: relative; }
  .hud { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .hud .pill { font-size: .95rem; }
  .board { position: relative; display: grid; border-radius: var(--radius); overflow: hidden; background: #e9f6ff;
           box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 0 0 4px #ffffff; aspect-ratio: var(--ar); }
  .cell { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; font-size: inherit; line-height: 1; border: 1px solid rgba(30,120,200,.08); }
  .cell.alt { background: rgba(255,255,255,.65); }
  .cell.goal { background: radial-gradient(circle, #ffe9a3 0%, transparent 75%); }
  .cell .ob { transition: transform .4s, opacity .4s; }
  .cell.got .ob { transform: scale(1.8) translateY(-40%); opacity: 0; }
  .cell.ice { background: linear-gradient(135deg, #c9efff, #8fd6ff); box-shadow: inset 0 0 12px #fff; }
  .cell.ice.melted { background: #dff3ff; transition: background .6s; }
  .cell.ice.melted .ob { transform: scale(0) rotate(90deg); opacity: 0; }
  .cell.trail::after { content: ""; position: absolute; width: 22%; height: 22%; border-radius: 50%; background: rgba(30,120,220,.35); }
  .spark { position: absolute; left: 0; top: 0; pointer-events: none; transition: left var(--spd) ease-in-out, top var(--spd) ease-in-out; z-index: 3;
           display: grid; place-items: center; }
  /* Spark's picture fills an inner box (88% of the square) and is scaled with object-fit, so it can never leave its square */
  .spark img { position: absolute; inset: 6%; width: 88%; height: 88%; object-fit: contain; object-position: 50% 50%; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); }
  .spark.bonk img { animation: bonk .45s; }
  .spark.happy img { animation: hop .5s 3; }
  @keyframes bonk { 20%,60% { transform: translateX(-5%) rotate(-8deg); } 40%,80% { transform: translateX(5%) rotate(8deg); } }
  @keyframes hop { 50% { transform: translateY(-6%) scale(1.04); } }
  .veil { position: absolute; inset: 0; z-index: 5; display: grid; place-items: center; text-align: center; color: white; font-weight: 800;
          font-size: 1.2rem; padding: 20px; transition: opacity 1.2s; border-radius: var(--radius); }
  .veil.fog { background: rgba(235,244,252,.93); color: #5a6f8c; backdrop-filter: blur(8px); }
  .veil.dark { background: rgba(5,12,35,.94); }
  .veil.gone { opacity: 0; pointer-events: none; }
  .veil .big { font-size: 3.5rem; display: block; margin-bottom: 8px; }

  /* ---------- side panel ---------- */
  .panel h2 { margin: 0 0 8px; font-size: 1.4rem; }
  .story { font-size: 1.1rem; line-height: 1.55; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .frosty { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; }
  .frosty .face { font-size: 2.4rem; flex: none; }
  .bubble { background: white; border: 3px solid var(--ice); border-radius: 16px; padding: 12px 14px; font-size: 1.05rem; line-height: 1.45; }
  .bubble.good { border-color: #7fd8a6; background: #effcf4; }
  .bubble.bad { border-color: #ffb3a7; background: #fff3f1; }
  .options { display: grid; gap: 10px; margin-top: 10px; }
  .opt { text-align: left; background: white; border: 3px solid #d3e4f7; border-radius: 14px; padding: 12px 14px; font-size: 1.1rem; display: flex; gap: 10px; align-items: center; }
  .opt:hover { border-color: var(--sky); }
  .opt .e { font-size: 1.7rem; }
  .opt.wrong { border-color: #ffb3a7; opacity: .6; }
  .builder .label { font-weight: 800; margin: 12px 0 6px; color: #3b5784; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: white; border: 3px solid #d3e4f7; border-radius: 999px; padding: 8px 14px; font-size: 1rem; }
  .chip.on { background: var(--sky); border-color: var(--sky); color: white; font-weight: 800; }
  .assembled { margin-top: 12px; background: #eef6ff; border-radius: 12px; padding: 12px; min-height: 48px; font-style: italic; }
  textarea { width: 100%; font: inherit; font-size: 1.05rem; border-radius: 12px; border: 3px solid #d3e4f7; padding: 12px; resize: vertical; }
  .checklist { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .checklist li { padding: 8px 10px; border-radius: 10px; background: #f0f4fa; }
  .checklist li.ok { background: #e3f8ea; }
  .checklist li.no { background: #fff0ee; }

  /* ---------- editors ---------- */
  .palette { display: flex; flex-wrap: wrap; gap: 8px; }
  .key { width: 64px; height: 64px; border-radius: 16px; font-size: 2rem; background: var(--blue); color: white; box-shadow: 0 4px 0 #0c4497; }
  .key.melt { background: #ff7b3d; box-shadow: 0 4px 0 #c0501b; width: auto; padding: 0 14px; font-size: 1.1rem; font-weight: 800; }
  .key.rep { background: #8e44ad; box-shadow: 0 4px 0 #5e2a75; width: auto; padding: 0 14px; font-size: 1.05rem; font-weight: 800; }
  .key.end { background: #6c5a8a; box-shadow: 0 4px 0 #463a5c; width: auto; padding: 0 14px; font-size: 1.05rem; font-weight: 800; }
  .key:active { transform: translateY(3px); box-shadow: none; }
  .program { margin-top: 12px; background: #eef4fb; border-radius: 14px; padding: 10px; min-height: 84px; display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; }
  .program.list { flex-direction: column; flex-wrap: nowrap; max-height: 330px; overflow-y: auto; }
  .program .empty { color: #7a8aa5; padding: 8px; }
  .tok { background: white; border: 3px solid #cfe0f4; border-radius: 12px; min-width: 46px; height: 46px; font-size: 1.5rem; display: grid; place-items: center; padding: 0 6px; }
  .tok.now { border-color: var(--gold); background: #fff6d6; transform: scale(1.12); }
  .tok.err { border-color: var(--red); background: #ffe3e0; }
  .blk { display: flex; align-items: center; gap: 8px; background: white; border-left: 8px solid var(--blue); border-radius: 10px; padding: 6px 8px; font-weight: 800; }
  .blk.rep { border-color: #8e44ad; background: #f6eefb; }
  .blk.end { border-color: #6c5a8a; background: #f1edf7; color: #6c5a8a; }
  .blk.melt { border-color: #ff7b3d; }
  .blk.now { background: #fff6d6; outline: 3px solid var(--gold); }
  .blk.err { background: #ffe3e0; outline: 3px solid var(--red); }
  .blk .n { background: #e3eefb; color: var(--blue); border-radius: 8px; padding: 2px 10px; font-weight: 900; }
  .blk .n:hover { background: var(--sky); color: white; }
  .blk .x { margin-left: auto; background: transparent; color: #9aa9c2; font-size: 1.1rem; }
  .blk .x:hover { color: var(--red); }
  .codebox { display: flex; border-radius: 12px; border: 3px solid #d3e4f7; overflow: hidden; background: #0f1c38; }
  .gutter { padding: 12px 6px 12px 10px; color: #5f7aa8; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1rem; line-height: 1.5; text-align: right; user-select: none; white-space: pre; overflow: hidden; }
  .gutter .now { color: var(--gold); font-weight: 900; }
  .gutter .err { color: #ff6b6b; font-weight: 900; }
  .codebox textarea { border: none; border-radius: 0; background: transparent; color: #e6f1ff; font-family: ui-monospace, Menlo, Consolas, monospace;
                      font-size: 1rem; line-height: 1.5; min-height: 230px; resize: vertical; white-space: pre; overflow-wrap: normal; overflow-x: auto; caret-color: var(--gold); }
  .ref { margin-top: 10px; font-size: .92rem; background: #eef4fb; border-radius: 12px; padding: 10px 12px; }
  .ref code { background: white; padding: 1px 6px; border-radius: 6px; }
  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 12px; font-weight: 700; line-height: 1.4; }
  .msg.info { background: #e6f2ff; color: #1a4a8a; }
  .msg.warn { background: #fff4d6; color: #7a5400; }
  .msg.err { background: #ffe8e5; color: #9b1c12; }
  .msg.ok { background: #e3f8ea; color: #17633a; }
  .counter { font-weight: 800; color: #3b5784; margin-top: 8px; }

  /* ---------- modal ---------- */
  .modal { position: fixed; inset: 0; background: rgba(5,12,35,.6); display: grid; place-items: center; z-index: 50; padding: 20px; }
  .modal .card { max-width: 460px; text-align: center; animation: pop .35s both; }
  .modal .stars { font-size: 3.2rem; letter-spacing: 6px; }
  .modal .stars span { display: inline-block; animation: pop .4s backwards; }
  .modal .stars .dim { filter: grayscale(1); opacity: .3; }
  .modal img { width: 90px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .confetti { position: fixed; top: -20px; font-size: 1.6rem; z-index: 60; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

  /* ---------- simple words for little readers (4–8) ---------- */
  .simple { font-size: 1.3rem; line-height: 1.6; font-weight: 700; letter-spacing: .2px; }
  .opt.simple { font-size: 1.3rem; padding: 16px; min-height: 72px; }
  .opt.simple .e { font-size: 2.2rem; }
  .parent { font-size: .98rem; font-weight: 700; color: #6a4c00; background: #fff4cf; border-radius: 12px; padding: 8px 12px; display: inline-block; }
  .parentNote { display: flex; gap: 12px; align-items: center; margin-top: 12px; background: #fff4cf; border: 3px dashed #f1c34b; border-radius: 14px; padding: 12px 14px; color: #5a4100; }
  .parentNote .pn-icon { font-size: 2.2rem; animation: bob 2.4s ease-in-out infinite; }
  .goalcard { display: flex; align-items: center; justify-content: center; gap: 18px; background: #eef6ff; border-radius: 16px; padding: 14px; margin: 12px 0; text-align: center; }
  .goalcard > div { display: grid; justify-items: center; }
  .goalcard .bigemoji { font-size: 3rem; display: inline-block; }
  .goalcard .arrowgo { font-size: 2.2rem; color: var(--blue); animation: nudge 1s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(8px); } }

  /* ---------- extra animation ---------- */
  .hero { position: relative; display: inline-block; width: 220px; height: 210px; }
  .hero img { position: absolute; left: 35px; top: 10px; cursor: pointer; }
  .hero img.spin { animation: spin .8s ease-in-out, bob 2.6s ease-in-out .8s infinite; }
  @keyframes spin { 50% { transform: scale(1.15) rotate(180deg); } to { transform: rotate(360deg); } }
  .lights { display: flex; justify-content: space-between; margin: -4px 4px 8px; }
  .lights i { width: 14px; height: 20px; border-radius: 50% 50% 45% 45%; animation: glow 1.5s ease-in-out infinite alternate; }
  .lights i:nth-child(4n+1) { background: #ff4d5e; color: #ff4d5e; } .lights i:nth-child(4n+2) { background: #ffd23f; color: #ffd23f; }
  .lights i:nth-child(4n+3) { background: #3ee08f; color: #3ee08f; } .lights i:nth-child(4n) { background: #4cc3ff; color: #4cc3ff; }
  @keyframes glow { from { opacity: .35; box-shadow: none; } to { opacity: 1; box-shadow: 0 0 14px 4px currentColor; } }
  .wiggle { display: inline-block; animation: wiggle 2.8s ease-in-out infinite; }
  .tier:hover .wiggle { animation-duration: .6s; }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg) scale(1.08); } 75% { transform: rotate(10deg) scale(1.08); } }
  .pop-in { animation: pop .45s backwards; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.07); box-shadow: 0 4px 0 #1a6b3d, 0 0 0 8px rgba(42,157,92,.25); } }
  .boing { animation: boing .35s; }
  @keyframes boing { 40% { transform: scale(1.25); } 70% { transform: scale(.92); } }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .drift { animation: drift 3s ease-in-out infinite; }
  @keyframes drift { 50% { transform: translate(10px, -6px) rotate(5deg); } }

  /* board life */
  .twinkle { display: inline-block; animation: twinkle 1.8s ease-in-out infinite; }
  @keyframes twinkle { 50% { transform: scale(1.14) rotate(-6deg); filter: drop-shadow(0 0 6px #ffd23f); } }
  .sleighbob { display: inline-block; animation: sleigh 2.2s ease-in-out infinite; }
  @keyframes sleigh { 50% { transform: translateY(-10%) rotate(-5deg); } }
  .sway { display: inline-block; transform-origin: 50% 90%; animation: sway 4s ease-in-out infinite; }
  @keyframes sway { 50% { transform: rotate(3deg); } }
  .cell.got .ob { animation: none; }
  .spark.idle img { animation: idle 1.6s ease-in-out infinite; }
  @keyframes idle { 50% { transform: translateY(-4%); } }
  .spark.walk img { animation: walk .34s ease-in-out infinite; }
  @keyframes walk { 50% { transform: translateY(-5%) rotate(4deg); } }
  .spark[data-face="l"] img { scale: -1 1; }
  .spark.zap img { animation: zap .5s; filter: drop-shadow(0 0 12px #ff9a3d); }
  @keyframes zap { 50% { transform: scale(1.06); } }
  .board.shake { animation: shake .35s; }
  .board.aurora::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: var(--radius);
    background: linear-gradient(115deg, rgba(62,224,143,.0), rgba(62,224,143,.28), rgba(76,195,255,.22), rgba(190,110,255,.25), rgba(62,224,143,.0));
    background-size: 300% 100%; animation: aurora 6s linear infinite; mix-blend-mode: multiply; }
  @keyframes aurora { to { background-position: 300% 0; } }
  .particle { position: absolute; z-index: 70; pointer-events: none; font-size: 1.4rem; transform: translate(-50%, -50%);
              animation: fly .85s ease-out forwards; }
  @keyframes fly { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.3) rotate(200deg); opacity: 0; } }
  .floaty { position: absolute; z-index: 8; pointer-events: none; transform: translate(-50%, 0); font-weight: 900; font-size: 1.25rem; color: var(--blue);
            text-shadow: 0 2px 0 #fff, 0 0 8px #fff; white-space: nowrap; animation: floatup 1.2s ease-out forwards; }
  @keyframes floatup { to { transform: translate(-50%, -140%); opacity: 0; } }

  /* win celebration */
  .winhero { position: relative; width: 140px; height: 130px; margin: 0 auto; display: grid; place-items: center; }
  .winhero .ray { position: absolute; inset: -30px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,197,61,.45) 0 12deg, transparent 12deg 30deg);
    animation: rays 6s linear infinite; mask: radial-gradient(circle, #000 35%, transparent 70%); -webkit-mask: radial-gradient(circle, #000 35%, transparent 70%); }
  @keyframes rays { to { transform: rotate(360deg); } }
  .winhero img.dance { position: relative; width: 100px; animation: dance .7s ease-in-out infinite; }
  @keyframes dance { 25% { transform: rotate(-10deg) translateY(-8px); } 75% { transform: rotate(10deg) translateY(-8px); } }
  .rainbow { background: linear-gradient(90deg, #e63946, #ff9a3d, #ffc53d, #2a9d5c, #1ea7ff, #8e44ad, #e63946); background-size: 200% auto;
             -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 3s linear infinite; font-size: 1.9rem; }
  @keyframes shine { to { background-position: 200% center; } }
  .modal .stars span:not(.dim) { animation: starpop .5s backwards; }
  @keyframes starpop { 0% { transform: scale(0) rotate(-180deg); } 70% { transform: scale(1.4) rotate(20deg); } }

  /* ---------- music button ---------- */
  .pill.music.on { background: rgba(62,224,143,.3); box-shadow: 0 0 0 2px rgba(62,224,143,.6); }
  .pill.music.on::after { content: "♪"; display: inline-block; margin-left: 6px; animation: bob 1.6s ease-in-out infinite; }

  /* ---------- bonus: holiday card maker ---------- */
  .bonus { margin-top: 20px; width: 100%; display: flex; align-items: center; gap: 18px; text-align: left; padding: 20px 24px; border-radius: var(--radius);
           background: linear-gradient(120deg, #e63946, #ff7b3d 45%, #ffc53d); color: white; box-shadow: 0 8px 0 rgba(0,0,0,.25); border: 4px solid transparent; transition: transform .15s; }
  .bonus:hover { transform: translateY(-5px); border-color: #fff; }
  .bonus > span:nth-child(2) { display: grid; gap: 4px; flex: 1; font-size: 1.05rem; }
  .bonus b { font-size: 1.5rem; }
  .bonus-icon { font-size: 3.2rem; }
  .bonus-tag { display: inline-block; justify-self: start; background: rgba(255,255,255,.25); border-radius: 999px; padding: 2px 10px; font-weight: 900; font-size: .85rem; }
  .bonus-go { background: white; color: #e63946; font-weight: 900; padding: 10px 16px; border-radius: 14px; white-space: nowrap; }
  @media (max-width: 640px) { .bonus { flex-wrap: wrap; } }
  .card-maker { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); }
  @media (max-width: 860px) { .card-maker { grid-template-columns: 1fr; } }
  .card-preview { position: relative; }
  .card-preview canvas { width: 100%; height: auto; display: block; border-radius: 18px; box-shadow: 0 14px 40px rgba(0,0,0,.45); background: #0b1f4d; }
  .card-preview .shuffle { position: absolute; top: 12px; left: 12px; background: rgba(5,15,40,.55); }
  .qdots { display: flex; gap: 8px; margin-bottom: 8px; }
  .qdots span { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; background: #e3eefb; color: #7a8aa5; }
  .qdots span.now { background: var(--blue); color: white; transform: scale(1.12); }
  .qdots span.done { background: var(--green); color: white; }
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; margin-top: 6px; }
  .cpick { display: grid; justify-items: center; gap: 6px; padding: 14px 8px; background: white; border: 3px solid #d3e4f7; border-radius: 16px; font-weight: 800; font-size: 1rem; }
  .cpick .ce { font-size: 2.6rem; height: 3.2rem; display: grid; place-items: center; }
  .cpick .ce-img { height: 3.2rem; width: auto; }
  .face-img { width: 44px; height: auto; display: block; }
  .cpick:hover { border-color: var(--sky); }
  .cpick.on { border-color: var(--gold); background: #fff6d6; box-shadow: 0 0 0 4px rgba(255,197,61,.35); }
  .cinput { width: 100%; font: inherit; font-size: 1.15rem; padding: 12px 14px; border-radius: 12px; border: 3px solid #d3e4f7; margin-top: 6px; }
  .cinput:focus { outline: 4px solid var(--gold); }
  .clabel { display: block; font-weight: 800; color: #3b5784; margin-top: 12px; }
  .ctip { font-size: .95rem; color: #3b5784; background: #eef4fb; border-radius: 12px; padding: 8px 12px; }

  /* ---------- grand finale ---------- */
  body.no-scroll { overflow: hidden; }
  .finale { position: fixed; inset: 0; height: 100dvh; z-index: 80; overflow: hidden; color: white;
            background: linear-gradient(#040b26 0%, #0d2560 55%, #24508f 100%); }
  .f-sky { position: absolute; inset: 0; }
  .fstar { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; box-shadow: 0 0 6px #fff; animation: twk 2.4s ease-in-out infinite; }
  @keyframes twk { 50% { opacity: .25; transform: scale(.6); } }
  .f-moon { position: absolute; right: 12%; top: 9%; width: min(34vmin, 300px); aspect-ratio: 1; border-radius: 50%;
            background: radial-gradient(circle at 38% 36%, #fffbe6, #ffe9a8 60%, #f3d27a); box-shadow: 0 0 80px 20px rgba(255,236,170,.35); }
  .f-aurora { position: absolute; left: -20%; right: -20%; top: 4%; height: 40%; opacity: .45; filter: blur(20px);
              background: linear-gradient(100deg, transparent 10%, rgba(62,224,143,.55) 30%, rgba(76,195,255,.45) 50%, rgba(190,110,255,.45) 70%, transparent 90%);
              animation: aur 9s ease-in-out infinite alternate; }
  @keyframes aur { to { transform: translateX(8%) skewX(-8deg); } }
  .f-hills { position: absolute; left: -10%; right: -10%; bottom: -12vh; height: 34vh; border-radius: 50% 50% 0 0; background: #eaf5ff;
             box-shadow: 0 -30px 0 0 #cfe6ff, 0 -60px 60px rgba(255,255,255,.15); }
  .f-town { position: absolute; left: 0; right: 0; bottom: 14vh; height: 140px; }
  .house { position: absolute; bottom: 0; width: var(--w); height: var(--h); background: #2b1f3d; border-radius: 4px 4px 0 0; }
  .house::before { content: ""; position: absolute; left: -8px; right: -8px; bottom: 100%; height: calc(var(--w) * .45); background: #3b2a55;
                   clip-path: polygon(50% 0, 100% 100%, 0 100%); border-top: 6px solid #fff; }
  .house i { position: absolute; top: 30%; width: 16px; height: 18px; background: #ffd166; box-shadow: 0 0 12px #ffd166; border-radius: 2px; animation: twk 3s infinite; }
  .house i:first-child { left: 18%; } .house i:nth-child(2) { right: 18%; animation-delay: 1.3s; }
  .house b { position: absolute; right: 18%; bottom: calc(100% + 8px); width: 14px; height: 34px; background: #5a3f2a; }
  .f-ride { position: absolute; left: 0; top: 0; width: min(78vw, 760px); transform: translate(-110%, 46vh); z-index: 3; }
  .finale.go .f-ride { animation: fly 6.2s cubic-bezier(.45,.05,.4,1) forwards; }
  @keyframes fly {
    0%   { transform: translate(-110%, 52vh) rotate(-4deg); }
    35%  { transform: translate(8vw, 24vh) rotate(-8deg); }
    55%  { transform: translate(28vw, 14vh) rotate(-2deg) scale(.95); }
    80%  { transform: translate(60vw, 8vh) rotate(-10deg) scale(.8); }
    100% { transform: translate(120vw, -30vh) rotate(-16deg) scale(.55); }
  }
  .finale.static .f-ride, .finale.done .f-ride { animation: none; transform: translate(calc(50vw - 50%), 16vh) scale(.9); }
  .finale.done .f-ride { animation: hover 3s ease-in-out infinite; }
  @keyframes hover { 50% { transform: translate(calc(50vw - 50%), 14vh) scale(.9) rotate(-2deg); } }
  .f-bob { position: relative; display: flex; align-items: flex-end; animation: bounce 1.1s ease-in-out infinite; }
  @keyframes bounce { 50% { transform: translateY(-14px); } }
  .f-deer { font-size: clamp(42px, 7vw, 82px); transform: scaleX(-1); position: relative; z-index: 2; display: inline-block; }
  .f-deer.d1 { order: 3; animation: gallop .5s ease-in-out infinite; }
  .f-deer.d2 { order: 2; animation: gallop .5s ease-in-out .17s infinite; margin-left: -6px; }
  .f-deer.d3 { order: 1; animation: gallop .5s ease-in-out .34s infinite; margin-left: -6px; }
  .f-deer.d1::after { content: ""; position: absolute; left: 6%; top: 28%; width: 14px; height: 14px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 14px 6px rgba(255,59,59,.8); animation: twk 1s infinite; }
  @keyframes gallop { 50% { transform: scaleX(-1) translateY(-10px) rotate(4deg); } }
  .f-reins { position: absolute; left: 34%; bottom: 46%; width: 44%; height: 30px; z-index: 1; overflow: visible; }
  .f-reins path { fill: none; stroke: #ffd166; stroke-width: 3; }
  .f-sleigh { order: 0; position: relative; width: clamp(150px, 26vw, 260px); margin-right: 6px; flex: none; }
  .f-body { position: relative; z-index: 2; width: 100%; display: block; filter: drop-shadow(0 8px 10px rgba(0,0,0,.4)); }
  .f-spark { position: absolute; z-index: 1; left: 27%; bottom: 46%; width: 44%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); animation: wave 1.2s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes wave { 50% { transform: rotate(-6deg) translateY(-4px); } }
  .f-sack { position: absolute; z-index: 0; left: 2%; bottom: 52%; font-size: clamp(20px, 3.4vw, 34px); letter-spacing: -8px; transform: rotate(-8deg); }
  .f-trail { position: absolute; right: 100%; bottom: 20%; width: 60vw; height: 8px; border-radius: 8px; order: -1;
             background: linear-gradient(90deg, transparent, rgba(255,232,140,.2) 40%, rgba(255,240,180,.9)); filter: blur(2px); }
  .f-trail::before, .f-trail::after { content: "✨ ⭐ ✨ ✦ ✨ ⭐"; position: absolute; right: 0; top: -22px; white-space: nowrap; font-size: 20px; letter-spacing: 18px; opacity: .9; animation: twk 1.2s infinite; }
  .f-trail::after { top: 10px; right: 30px; animation-delay: .6s; }
  .finale.done .f-trail, .finale.static .f-trail { opacity: .4; }
  .f-gift { position: fixed; z-index: 4; font-size: 38px; pointer-events: none; animation: drop 2.2s cubic-bezier(.5,0,1,.8) forwards; }
  @keyframes drop { to { transform: translate(-8vw, 60vh) rotate(380deg); opacity: .2; } }
  .f-skip { position: absolute; right: 18px; top: 18px; z-index: 6; background: rgba(255,255,255,.16); color: #fff; font-weight: 800; padding: 10px 16px; border-radius: 999px; }
  .f-skip:hover { background: rgba(255,255,255,.3); }
  .finale.done .f-skip { display: none; }
  .f-panel { position: absolute; z-index: 7; left: 0; right: 0; margin: 0 auto; bottom: 5vh; width: min(92vw, 620px); text-align: center;
             background: #f4fbff; color: var(--ink); border-radius: 24px; padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: pop .5s both; }
  .f-panel[hidden] { display: none; }
  .f-panel h2 { margin: 4px 0 6px; font-size: clamp(1.5rem, 4vw, 2.2rem); }
  .f-panel .f-big { font-size: 1.35rem; margin: 6px 0; }
  .f-panel-spark { width: 64px; margin-top: -60px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); animation: dance .8s ease-in-out infinite; }
  .f-panel { max-height: calc(100% - 4vh); overflow-y: auto; }
  @media (max-width: 560px) { .f-panel { bottom: 2vh; padding: 16px 14px; } .f-panel .row { flex-direction: column; align-items: stretch; } .f-panel-spark { width: 48px; margin-top: -10px; } }
  @media (max-height: 640px) { .f-panel { bottom: 2vh; padding: 14px 16px; } .f-panel-spark { display: none; } }

  /* ---------- certificate ---------- */
  .cert-layout { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
  @media (max-width: 960px) { .cert-layout { grid-template-columns: 1fr; } }
  .cert-preview canvas { width: 100%; height: auto; display: block; border-radius: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.45); background: #fffdf5; }
  .donebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: #fff4cf; border: 3px solid #f1c34b; }
  .donebar span { flex: 1; min-width: 160px; font-size: 1.1rem; }

  /* ---------- language picker ---------- */
  .langpick { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; cursor: pointer; }
  .langpick select { font: inherit; font-weight: 700; color: #fff; background: transparent; border: 0; cursor: pointer; padding: 2px 0; max-width: 9.5em; }
  .langpick select:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
  .langpick option { color: var(--ink); background: #fff; }

  /* ---------- right-to-left (Arabic) ---------- */
  [dir="rtl"] .bubble, [dir="rtl"] .opt, [dir="rtl"] .mission, [dir="rtl"] .tier, [dir="rtl"] .bonus { text-align: right; }
  [dir="rtl"] .mission .stars { margin-left: 0; margin-right: auto; }
  [dir="rtl"] .blk .x { margin-left: 0; margin-right: auto; }
  [dir="rtl"] .goalcard .arrowgo { transform: scaleX(-1); }
  [dir="rtl"] .card-preview .shuffle { left: auto; right: 12px; }
  .board, .codebox, .program:not(.list) { direction: ltr; }   /* grids and code always read left→right */

  /* ---------- card maker: designer mode (ages 9–16) ---------- */
  .card-maker.designer .panel { background: #f7f4ee; }
  .card-maker.designer .bubble { border-color: #d9cfbd; background: #fffdf8; }
  .dgrid { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .dpick { padding: 6px 6px 10px; gap: 8px; font-weight: 700; font-size: .92rem; border-color: #e3dccd; border-radius: 12px; }
  .dpick .dthumb { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; display: block; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .dpick.on { border-color: #b8894a; background: #fbf3e4; box-shadow: 0 0 0 3px rgba(184,137,74,.35); }
  .card-maker.designer .chip.on { background: #2f4a44; border-color: #2f4a44; }
  .card-maker.designer .qdots span.now { background: #2f4a44; }
  .card-maker.designer .qdots span.done { background: #b8894a; }
  .clabel2 { margin-top: 14px; font-weight: 800; color: #3b5784; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 120; background: #10213f; color: #fff; padding: 12px 18px;
           border-radius: 14px; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.4); max-width: min(92vw, 520px); text-align: center; animation: pop .3s both; }

  /* ---------- automatic board reset after a failed run ---------- */
  .resetnote { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); z-index: 6; max-width: 90%; text-align: center;
               background: rgba(16,33,63,.9); color: #fff; font-weight: 800; font-size: clamp(.95rem, 2.4vw, 1.15rem); padding: 10px 18px;
               border-radius: 999px; box-shadow: 0 6px 18px rgba(0,0,0,.35); animation: pop .3s both; pointer-events: none; }
  .resetnote.done { background: rgba(42,157,92,.95); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <img src="spark.png" alt="">
      <h1>Spark's Snowy Code Quest</h1>
    </div>
    <span class="aikids"><img src="aikids-logo.png" alt="AIKids"></span>
    <div class="actions">
      <label class="pill langpick" title="Language"><span aria-hidden="true">🌐</span><select id="langSel" aria-label="Language"></select></label>
      <button class="pill music" id="musicBtn" aria-pressed="false" title="Play a calm holiday song">🎵 Music off</button>
      <button class="pill" id="soundBtn" aria-label="Toggle sound">🔊 Sound</button>
      <button class="pill hidden" id="homeBtn">🏠 Home</button>
    </div>
  </header>
  <main id="screen"></main>
</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="card" id="modalCard"></div></div>

<script src="i18n.js"></script>

<script src="lang/ar.js"></script>
<script src="music.js"></script>
<script src="card-assets.js"></script>
<script src="card.js"></script>

</body>
